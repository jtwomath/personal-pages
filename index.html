<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>My Personal Site</title>
</head>
<body>
  <h1>안녕하세요</h1>
  <p>Cloudflare Pages 첫 페이지입니다.</p>

<h2>API 테스트</h2>
<button id="btnHello">/api/hello 호출</button>
<pre id="out" style="padding:12px; border:1px solid #ccc; border-radius:8px;"></pre>

<script>
  document.getElementById("btnHello").addEventListener("click", async () => {
    const out = document.getElementById("out");
    out.textContent = "호출 중...";

    try {
      const res = await fetch("/api/hello");
      if (!res.ok) throw new Error("HTTP " + res.status);

      const data = await res.json();

      // time / utcTime / serverUtc 중 뭐가 와도 처리
      const rawUtc = data.serverUtc ?? data.utcTime ?? data.time ?? null;
      const utc = rawUtc ? new Date(rawUtc) : new Date();

      const result = {
        serverUtc: utc.toISOString(),
        serverKst: utc.toLocaleString("ko-KR", { timeZone: "Asia/Seoul" }),
        browserLocal: new Date().toLocaleString("ko-KR"),
        browserTZ: Intl.DateTimeFormat().resolvedOptions().timeZone,
        rawFromApi: rawUtc, // 디버그용(원하면 삭제)
      };

      out.textContent = JSON.stringify(result, null, 2);
    } catch (err) {
      out.textContent = "실패: " + err.message;
    }
  });
</script>

<h2>내 앱</h2>
<ul>
  <li>TimeLogPDF</li>
  <li>PhotoClear (개발 중)</li>
</ul>

</body>
</html>
