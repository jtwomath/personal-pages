<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 홈</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      color: #ffa500;
      font-family: 'Segoe UI', sans-serif;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .date {
      font-size: 24px;
      margin-bottom: 10px;
      color: #ccc;
    }

    .time {
      font-size: 120px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .ampm {
      font-size: 32px;
      margin-right: 10px;
    }

    .buttons {
      margin-top: 40px;
      display: flex;
      gap: 12px;
    }

    .size-buttons {
      margin-top: 24px;
      display: flex;
      gap: 10px;
    }

    .size-buttons button {
      background: #444;
      padding: 8px 14px;
      font-size: 13px;
    }

    .size-buttons button:hover {
      background: #666;
    }

    a {
      text-decoration: none;
    }

    button {
      padding: 12px 20px;
      border-radius: 10px;
      border: none;
      background: #2f6fdd;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #2359b4;
    }
  </style>
</head>

<body>

  <div class="date" id="date"></div>

  <div>
    <span class="ampm" id="ampm"></span>
    <span class="time" id="time"></span>
  </div>

  <div class="size-buttons">
    <button id="smallBtn">- 작게</button>
    <button id="resetBtn">초기화</button>
    <button id="largeBtn">+ 크게</button>
  </div>

  

  <script>
    function updateClock() {
      const now = new Date();

      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const week = ["일", "월", "화", "수", "목", "금", "토"];

      document.getElementById("date").innerText =
        `${year}년 ${month}월 ${day}일 ${week[now.getDay()]}요일`;

      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      const ampm = hours >= 12 ? "오후" : "오전";
      hours = hours % 12;
      hours = hours ? hours : 12;

      document.getElementById("ampm").innerText = ampm;
      document.getElementById("time").innerText =
        `${String(hours).padStart(2, '0')}:${minutes}:${seconds}`;
    }

    let clockSize = Number(localStorage.getItem("clock_size")) || 120;

    function applyClockSize() {
      document.getElementById("time").style.fontSize = clockSize + "px";
    }

    document.getElementById("largeBtn").addEventListener("click", () => {
      clockSize += 10;

      if (clockSize > 160) {
        clockSize = 160;
      }

      localStorage.setItem("clock_size", clockSize);
      applyClockSize();
    });

    document.getElementById("smallBtn").addEventListener("click", () => {
      clockSize -= 10;

      if (clockSize < 60) {
        clockSize = 60;
      }

      localStorage.setItem("clock_size", clockSize);
      applyClockSize();
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      clockSize = 120;
      localStorage.setItem("clock_size", clockSize);
      applyClockSize();
      });

    applyClockSize();

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
